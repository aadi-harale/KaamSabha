name: Iteration 2 visual check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  screenshot:
    if: github.head_ref == 'iteration-2-judge-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start production server
        run: |
          npm run start > /tmp/kaamsabha-server.log 2>&1 &
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8787/demo > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kaamsabha-server.log
          exit 1
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise judge flow and capture screenshots
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const base = 'http://127.0.0.1:8787';
          const browser = await chromium.launch({ headless: true });
          const viewports = [
            ['desktop', { width: 1440, height: 900 }],
            ['mobile', { width: 390, height: 844 }],
          ];

          for (const [name, viewport] of viewports) {
            const context = await browser.newContext({ viewport });
            const page = await context.newPage();
            await page.goto(`${base}/demo`, { waitUntil: 'networkidle' });
            await page.screenshot({ path: `iteration2-${name}-initial.png`, fullPage: true });

            await page.getByRole('button', { name: 'Run comparison' }).click();
            await page.locator('.judge-proof-line').waitFor({ state: 'visible', timeout: 8000 });
            const constitutionResult = await page.locator('.constitution-decision strong').first().textContent();
            if (!constitutionResult || constitutionResult.includes('Waiting')) {
              throw new Error(`Constitution result did not reveal on ${name}.`);
            }
            await page.screenshot({ path: `iteration2-${name}-compared.png`, fullPage: true });

            await page.getByRole('button', { name: /Explain the assignment/ }).click();
            await page.getByRole('dialog').getByText('Why this assignment?').waitFor();
            await page.keyboard.press('Escape');

            await page.getByRole('link', { name: /Govern the next rule/ }).click();
            await page.waitForURL('**/demo/governance');
            await page.getByRole('heading', { name: 'The rules are ours to write.' }).waitFor();

            await page.goto(`${base}/demo`, { waitUntil: 'networkidle' });
            await page.getByRole('link', { name: /Challenge a decision/ }).click();
            await page.waitForURL('**/demo/worker?challenge=true');
            await page.getByText('Replay Court').waitFor();
            await page.screenshot({ path: `iteration2-${name}-challenge.png`, fullPage: true });
            await context.close();
          }

          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: iteration2-screenshots
          path: iteration2-*.png
